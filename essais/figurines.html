<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VASLweb — essai : figurines filaires</title>
<style>
:root{--fond:#1b1b1b;--panneau:#262626;--bord:#444;--texte:#e8e6df;--accent:#d9a441}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fond);color:var(--texte);font:14px/1.4 system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{padding:8px 12px;border-bottom:1px solid var(--bord)}
header h1{margin:0;font-size:16px}
header p{margin:2px 0 0;font-size:12px;opacity:.8}
#scene{flex:1;min-height:240px;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#bas{background:var(--panneau);border-top:1px solid var(--bord);padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.rangee{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{background:#333;color:var(--texte);border:1px solid var(--bord);border-radius:4px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover{border-color:var(--accent)}
button.actif{background:var(--accent);color:#111;border-color:var(--accent)}
label{display:flex;align-items:center;gap:6px;font-size:12px}
input[type=range]{width:130px}
#info{font-size:12px;opacity:.85}
</style>
</head>
<body>
<header>
  <h1>Essai — figurines filaires à la place du pion</h1>
  <p>Page d'essai isolée : rien ici n'est branché sur VASLweb. Toucher un hexagone pour y déplacer la squad.</p>
</header>
<div id="scene"><canvas id="cv"></canvas></div>
<div id="bas">
  <div class="rangee" id="etats">
    <button data-etat="debout">Debout</button>
    <button data-etat="tir">Tir</button>
    <button data-etat="couche">À terre (Pin)</button>
    <button data-etat="casse">Cassé</button>
    <span style="flex:1"></span>
    <button id="reduire">Réduire en HS</button>
    <button id="eliminer">Éliminer</button>
    <button id="reinit">Réinitialiser</button>
  </div>
  <div class="rangee">
    <label>Taille du pion <input type="range" id="taille" min="48" max="360" value="200"><span id="tailleV"></span></label>
    <label>Hauteur de vue <input type="range" id="vue" min="20" max="90" value="50"><span id="vueV"></span></label>
    <label><input type="checkbox" id="auto" checked> Pion classique sous 100 px</label>
    <label><input type="checkbox" id="plaque" checked> Plaque du pion</label>
    <label><input type="checkbox" id="noms"> Étiquettes d'armes</label>
  </div>
  <div id="info"></div>
</div>
<script src="figurines.js"></script>
</body>
</html>
